
<!doctype html><html><head><meta charset="utf-8"><title>Admin - Custom Price</title>
<style>body{font-family:sans-serif;background:#FFFBF5;padding:16px}.card{background:white;padding:12px;border-radius:12px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}.premium{border-left:4px solid #FF6B2C}.free{border-left:4px solid #999}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"YOUR_KEY", authDomain:"website-1cb04.firebaseapp.com", projectId:"website-1cb04"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);

window.setCustomPrice = async (id)=>{
  const price = document.getElementById('price_'+id).value;
  if(!price) return alert('Enter price');
  await updateDoc(doc(db,"shops",id), {premiumPrice: parseInt(price)});
  alert('Price set to Rs '+price);
  location.reload();
}
window.togglePremium = async (id, current, price)=>{
  const customPrice = document.getElementById('price_'+id).value || price || 500;
  const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate()+7);
  const nextMonth = new Date(); nextMonth.setDate(nextMonth.getDate()+30);
  // Ask duration
  const duration = prompt('Duration? Enter 7 for week, 30 for month', '7');
  const until = duration=='30' ? nextMonth : nextWeek;
  await updateDoc(doc(db,"shops",id), {
    isPremium: !current,
    subscriptionStatus: !current ? "active" : "free",
    premiumUntil: !current ? Timestamp.fromDate(until) : null,
    premiumPrice: parseInt(customPrice),
    actualPricePaid: !current ? parseInt(customPrice) : 0
  });
  location.reload();
}
window.togglePopular = async (id, current)=>{ await updateDoc(doc(db,"shops",id), {isPopular: !current}); location.reload(); }
window.toggleBanner = async (id, current)=>{ await updateDoc(doc(db,"shops",id), {isBannerAd: !current}); location.reload(); }

async function load(){
  const snap = await getDocs(collection(db,"shops"));
  document.getElementById('list').innerHTML = snap.docs.map(d=>{
    const s=d.data();
    return `<div class="card ${s.isPremium?'premium':'free'}">
      <b>${s.name}</b> - ${s.phone} - ${s.ownerEmail||''}<br>
      Current: ${s.isPremium?'✅ Premium Rs '+(s.premiumPrice||500):'🆓 Free'} | Price Setting: <input type="number" id="price_${d.id}" value="${s.premiumPrice||500}" style="width:80px;" placeholder="500"/> 
      <button onclick="setCustomPrice('${d.id}')">Set Price</button><br>
      Views:${s.views||0} Calls:${s.callClicks||0} | Popular:${s.isPopular?'🔥':''} Banner:${s.isBannerAd?'⭐':''}<br>
      <button onclick="togglePremium('${d.id}',${!!s.isPremium},${s.premiumPrice||500})">${s.isPremium?'Make Free':'Make Premium (Custom Price)'}</button>
      <button onclick="togglePopular('${d.id}',${!!s.isPopular})">Popular Rs1500</button>
      <button onclick="toggleBanner('${d.id}',${!!s.isBannerAd})">Banner Rs2000</button>
      <hr><small>Free gets banner + 10 images. Premium gets social, map, book, verified, top priority</small>
    </div>`;
  }).join('');
}
load();
</script></head>
<body>
<h1>Admin - Customizable Premium Price</h1>
<p>Set custom price per shop: Rs 300 for small shop, Rs 500 normal, Rs 800 for big shop, Rs 1000 for best location</p>
<p>Free = Banner + 10 images allowed. Premium = Social links, map, book, verified, top, analytics</p>
<div id="list">Loading...</div>
</body></html>
