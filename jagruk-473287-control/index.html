<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Desi Bazaar - Apna Local Bazaar | Jaora, Raghogarh, Rajgarh</title>
<meta name="description" content="Jaora ka apna bazaar - Local shops, products, services"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF6B2C;--orange2:#FF8A50;--bg:#FFFBF5;--cream:#FFF0E6;--border:#F3E8D3;--ink:#1A1A1A;--muted:#6B7280}
*{box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);margin:0;color:var(--ink)}
h1,h2,h3{font-family:'Fraunces',serif}
.header{background:white;border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand img{width:36px;height:36px;border-radius:10px}
.hero{background:linear-gradient(135deg,#FF6B2C,#FF8A50);color:white;padding:28px 16px;text-align:center}
.hero h1{margin:0;font-size:28px}
.filters{background:white;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:40;display:flex;gap:8px;overflow-x:auto}
.filter-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:white;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.filter-btn.active{background:var(--ink);color:white;border-color:var(--ink)}
.container{padding:12px 16px;max-width:1200px;margin:0 auto}
.shop-card{background:white;border-radius:16px;border:1px solid var(--border);overflow:hidden;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.shop-banner{width:100%;height:180px;background:var(--cream);object-fit:cover;display:block}
.shop-banner.placeholder{display:flex;align-items:center;justify-content:center;font-size:40px;color:#F3E8D3}
.shop-body{padding:14px}
.shop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.shop-name{font-size:17px;font-weight:800;margin:0}
.shop-meta{font-size:12px;color:var(--muted);margin:4px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{padding:4px 8px;border-radius:12px;font-size:10px;font-weight:800}
.badge-verified{background:#D1FAE5;color:#065F46}.badge-premium{background:#FFF0E6;color:#FF6B2C;border:1px solid var(--orange)}.badge-popular{background:#1A1A1A;color:#FFD700}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-call{flex:1;background:var(--ink);color:white;border:0;padding:10px;border-radius:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-wa{flex:1;background:#25D366;color:white;border:0;padding:10px;border-radius:12px;font-weight:700;cursor:pointer}
.btn-map{flex:1;background:white;border:1px solid var(--border);padding:10px;border-radius:12px;font-weight:700;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
.product-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#FFFBF5}
.product-card img{width:100%;height:110px;object-fit:cover;background:var(--cream)}
.product-body{padding:8px}
.product-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-price{font-size:12px;font-weight:800;color:var(--orange);margin-top:2px}
.search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none}
.search:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,44,.15)}
.no-img{width:100%;height:180px;background:linear-gradient(135deg,#FFF0E6,#F3E8D3);display:flex;align-items:center;justify-content:center;font-size:48px}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBtcdBS75tgYJ5W1wilHT9y4rNI1LzUAHI",
  authDomain: "website-1cb04.firebaseapp.com",
  projectId: "website-1cb04",
  storageBucket: "website-1cb04.firebasestorage.app",
  messagingSenderId: "392147898697",
  appId: "1:392147898697:web:faa25a34b938ccd739ca98"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allShops = [];
let allProducts = [];
let activeCategory = 'All';
async function loadData(){
  document.getElementById('status').textContent='Loading Jaora Bazaar...';
  // Load approved shops only
  const q = query(collection(db,"shops"), where("approved","==",true));
  const snap = await getDocs(q);
  allShops = snap.docs.map(d=>({id:d.id,...d.data()}));
  
  // Sort: Popular + Banner + Premium first, then by views
  allShops.sort((a,b)=>{
    const scoreA = (a.isBannerAd?1000:0)+(a.isPopular?500:0)+(a.isPremium?200:0)+(a.views||0);
    const scoreB = (b.isBannerAd?1000:0)+(b.isPopular?500:0)+(b.isPremium?200:0)+(b.views||0);
    return scoreB - scoreA;
  });
  
  // Load all products for approved shops
  const psnap = await getDocs(collection(db,"products"));
  allProducts = psnap.docs.map(d=>({id:d.id,...d.data()})).filter(p=> allShops.some(s=>s.id===p.shopId));
  
  document.getElementById('status').textContent = `Jaora • ${allShops.length} shops • ${allProducts.length} products`;
  renderShops();
}
function renderShops(){
  const container = document.getElementById('shops');
  const search = document.getElementById('searchInput').value.toLowerCase();
  container.innerHTML='';
  
  let filtered = allShops.filter(s=>{
    const matchSearch = !search || (s.name||'').toLowerCase().includes(search) || (s.category||'').toLowerCase().includes(search) || (s.area||'').toLowerCase().includes(search);
    const matchCat = activeCategory==='All' || (s.category||'General')===activeCategory;
    return matchSearch && matchCat;
  });
  
  if(filtered.length===0){
    container.innerHTML='<p style="text-align:center;color:#6B7280;padding:20px;">No shops found. Try different search.</p>';
    return;
  }
  
  filtered.forEach(shop=>{
    const shopProducts = allProducts.filter(p=>p.shopId===shop.id).slice(0,4);
    const banner = shop.bannerImage;
    const hasBanner = banner && banner.startsWith('http');
    
    const el = document.createElement('div');
    el.className='shop-card';
    el.innerHTML = `
      ${hasBanner ? `<img class="shop-banner" src="${banner}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/><div class="no-img" style="display:none;">🏪</div>` : `<div class="no-img">🏪</div>`}
      <div class="shop-body">
        <div class="shop-top">
          <div>
            <h3 class="shop-name">${shop.name||'Shop'}</h3>
            <div class="shop-meta">
              <span>📍 ${shop.area||shop.address||'Jaora'}</span>
              <span>🏷️ ${shop.category||'General'}</span>
              ${shop.isVerified ? `<span class="badge badge-verified">✓ Verified</span>` : ''}
              ${shop.isPremium ? `<span class="badge badge-premium">Premium</span>` : ''}
              ${shop.isPopular ? `<span class="badge badge-popular">★ Popular</span>` : ''}
            </div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-call" onclick="trackCall('${shop.id}','${shop.phone||''}')">📞 Call</button>
          ${shop.isPremium ? `<button class="btn-wa" onclick="trackBook('${shop.id}','${shop.phone||''}')">💬 WhatsApp</button><button class="btn-map" onclick="trackMap('${shop.id}')">📍 Map</button>` : `<button class="btn-map" style="flex:1;" onclick="alert('Map available for Premium shops')">📍 Map (Premium)</button>`}
        </div>
        ${shopProducts.length>0 ? `<div class="products">${shopProducts.map(p=>`
          <div class="product-card">
            ${p.image ? `<img src="${p.image}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=No+Image'"/>` : `<div style="height:110px;background:#FFF0E6;display:flex;align-items:center;justify-content:center;">📦</div>`}
            <div class="product-body"><div class="product-name">${p.name||'Product'}</div><div class="product-price">${p.price?`Rs ${p.price}`:''}</div></div>
          </div>
        `).join('')}</div>` : `<p style="font-size:12px;color:#6B7280;margin-top:10px;">No products yet</p>`}
      </div>
    `;
    container.appendChild(el);
  });
}
window.trackCall = async(shopId, phone)=>{
  try{ await updateDoc(doc(db,"shops",shopId), {callClicks: increment(1)}); }catch(e){}
  if(phone) window.open(`tel:${phone}`,'_blank');
}
window.trackMap = async(shopId)=>{
  try{ await updateDoc(doc(db,"shops",shopId), {mapClicks: increment(1)}); }catch(e){}
  const shop = allShops.find(s=>s.id===shopId);
  if(shop?.address || shop?.area){
    window.open(`https://maps.google.com/?q=${encodeURIComponent(shop.address||shop.area+', Jaora')}`,'_blank');
  }
}
window.trackBook = async(shopId, phone)=>{
  try{ await updateDoc(doc(db,"shops",shopId), {bookClicks: increment(1)}); }catch(e){}
  if(phone) window.open(`https://wa.me/91${phone.replace(/[^0-9]/g,'').slice(-10)}?text=Hi, I saw your shop on Desi Bazaar`,'_blank');
}
// Auto view increment
async function addView(shopId){
  try{ await updateDoc(doc(db,"shops",shopId), {views: increment(1)}); }catch(e){}
}
window.filterCategory = (cat, btn)=>{
  activeCategory=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderShops();
}
window.searchShops = ()=> renderShops();
loadData();
// Track views when card visible (lazy)
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const shopId = e.target.dataset.shopId;
      if(shopId) addView(shopId);
      observer.unobserve(e.target);
    }
  });
}, {threshold:0.5});
</script>
</head>
<body>
<div class="header">
  <div class="brand"><img src="./favicon.io/android-chrome-512x512.png" onerror="this.style.display='none'"/> देसी बाजार <span style="font-weight:400;font-size:12px;color:#6B7280;">Jaora</span></div>
  <div style="font-size:12px;color:#6B7280;">Apna Local Bazaar</div>
</div>
<div class="hero">
  <h1>Jaora Bazaar 🛍️</h1>
  <p style="margin:8px 0 0 0;opacity:.9;">Jaora, Raghogarh, Rajgarh ka apna local bazaar</p>
  <div style="margin-top:14px;max-width:500px;margin-left:auto;margin-right:auto;">
    <input id="searchInput" class="search" placeholder="Search shop, product, area..." oninput="searchShops()"/>
  </div>
  <p id="status" style="font-size:12px;opacity:.8;margin-top:8px;">Loading...</p>
</div>
<div class="filters">
  <button class="filter-btn active" onclick="filterCategory('All',this)">All</button>
  <button class="filter-btn" onclick="filterCategory('Clothing',this)">Clothing</button>
  <button class="filter-btn" onclick="filterCategory('Electronics',this)">Electronics</button>
  <button class="filter-btn" onclick="filterCategory('Grocery',this)">Grocery</button>
  <button class="filter-btn" onclick="filterCategory('Decor',this)">Decor</button>
  <button class="filter-btn" onclick="filterCategory('Footwear',this)">Footwear</button>
  <button class="filter-btn" onclick="filterCategory('General',this)">General</button>
</div>
<div class="container"><div id="shops"></div></div>
</body></html>
