<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Jaora Bazaar - Apna Local Bazaar</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-desi-32.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFBF5;--card:#FFFFFF;--ink:#1A1A1A;--muted:#6B7280;--line:#F3E8D3;--orange:#FF6B2C;--orange-light:#FFF0E6;--radius:20px;--shadow:0 8px 32px rgba(0,0,0,0.06)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}.top{position:sticky;top:0;z-index:50;background:rgba(255,251,245,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-inner{display:flex;justify-content:space-between;align-items:center;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px}.brand-icon{width:40px;height:40px;background:var(--orange);border-radius:12px;display:grid;place-items:center;color:#fff}
.btn{padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{padding:32px 0 20px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:24px}
.hero h1{font-family:'Fraunces',serif;font-size:clamp(30px,5vw,50px);line-height:0.95}.hero h1 em{color:var(--orange);font-style:normal}
.filters{position:sticky;top:72px;z-index:40;background:rgba(255,251,245,0.95);backdrop-filter:blur(16px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.search{flex:1;min-width:240px;position:relative}.search input{width:100%;padding:11px 18px 11px 38px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.badge-cat{background:var(--orange-light);color:var(--orange)}.badge-open{background:#ECFDF5;color:#0E9F6E}
.title{font-weight:700;font-size:16px;margin:8px 0 2px}.meta{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px}.act{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:13px;text-align:center;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink)}.act-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="top-inner">
<div class="brand"><div class="brand-icon">🛍</div>Jaora Bazaar</div>
<div style="display:flex;gap:8px"><a class="btn" href="./shop/">Shop Login</a><a class="btn btn-primary" href="#shops">Explore</a></div>
</div></div></div>
<div class="wrap">
<div class="hero"><div>
<h1>Apna local bazaar — <em>Jaora, Raghogarh ka apna.</em></h1>
<p style="color:#6B7280;margin-top:10px">Local dukaan, grocery, kapde, electronics — sab kuch ek jagah.</p>
<div style="display:flex;gap:20px;margin-top:14px"><div><b id="totalShops">...</b><div style="font-size:11px;color:#6B7280">SHOPS LIVE</div></div><div><b id="debug">Loading...</b><div style="font-size:11px;color:#6B7280">DEBUG</div></div></div>
</div>
<div style="background:#fff;border-radius:20px;padding:14px;border:1px solid #F3E8D3;box-shadow:0 8px 32px rgba(0,0,0,0.06)">
<div style="font-size:11px;color:#6B7280">POPULAR</div>
<div style="padding:6px 0;font-size:13px">⚡ Sharma Electricals</div><div style="padding:6px 0;font-size:13px">👕 Raghogarh Fashion</div><div style="padding:6px 0;font-size:13px">🥦 Fresh Mart</div>
</div></div>
<div class="filters"><div style="display:flex;gap:8px;flex-wrap:wrap">
<div class="search"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%)">🔍</span><input id="searchBox" placeholder="Search..."/></div>
<select id="townFilter" class="chip"><option value="">All Towns</option><option>Jaora</option><option>Raghogarh</option><option>Rajgarh</option></select>
<select id="catFilter" class="chip"><option value="">All</option><option>Grocery</option><option>Clothing</option><option>Electronics</option><option>Food</option><option>Beauty</option></select>
</div></div>
<div id="shops" class="grid"></div>
<div id="empty" style="display:none;text-align:center;padding:40px;color:#6B7280">
<div style="font-size:32px">📦</div><h3 id="emptyMsg">No shops</h3><p id="emptyDetail">Checking...</p>
<pre id="debugLog" style="text-align:left;background:#fff;padding:10px;border-radius:12px;margin-top:12px;font-size:11px;overflow:auto;max-height:200px"></pre>
</div>
</div>
<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBtcdBS75tgYJ5W1wilHT9y4rNI1LzUAHI",
  authDomain: "website-1cb04.firebaseapp.com",
  projectId: "website-1cb04",
  storageBucket: "website-1cb04.firebasestorage.app",
  messagingSenderId: "392147898697",
  appId: "1:392147898697:web:faa25a34b938ccd739ca98",
  measurementId: "G-RWF18VNE3E"
};
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs, query, where, doc, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
function log(msg){
  const el = document.getElementById('debugLog');
  if(el) el.textContent += '\n' + new Date().toLocaleTimeString() + ' - ' + msg;
  console.log(msg);
}
let allShops = [];
async function load(){
  try{
    log('Fetching ALL shops from website-1cb04...');
    const qAll = query(collection(db, 'shops'));
    const snapAll = await getDocs(qAll);
    log(`ALL shops: ${snapAll.size} docs`);
    
    const qApproved = query(collection(db, 'shops'), where('approved','==',true));
    const snapApproved = await getDocs(qApproved);
    log(`APPROVED shops (approved==true): ${snapApproved.size} docs`);
    
    // Show ALL for now to debug - Change to approved later
    allShops = snapAll.docs.map(d => ({id:d.id, ...d.data()}));
    
    document.getElementById('totalShops').textContent = allShops.length;
    document.getElementById('debug').textContent = `All:${snapAll.size} Approved:${snapApproved.size}`;
    
    if(snapAll.size>0 && snapApproved.size===0){
      document.getElementById('emptyMsg').textContent = `${snapAll.size} shops found but 0 approved`;
      document.getElementById('emptyDetail').textContent = `Go to /jagruk-473287-control/ and click Approve - Now showing ALL for debugging`;
      // Still show all for debugging
    }
    
    render(allShops);
    
    if(snapAll.size===0){
      document.getElementById('empty').style.display='block';
      document.getElementById('emptyMsg').textContent='No shops in Firebase';
      document.getElementById('emptyDetail').textContent='Add shop in /jagruk-473287-control/';
    }
    
  }catch(e){
    log('ERROR: '+e.code+' '+e.message);
    document.getElementById('empty').style.display='block';
    document.getElementById('emptyMsg').textContent='Error: '+e.code;
    document.getElementById('emptyDetail').textContent=e.message+' - Check Firestore Rules: allow read if true';
  }
}
function render(list){
  const grid=document.getElementById('shops');
  const empty=document.getElementById('empty');
  if(list.length===0){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML=list.map(s=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><span class="badge badge-cat">${s.category||'Shop'}</span><span class="badge badge-open">${s.approved?'✅':'⏳ '+ (s.approved===false?'Pending':'')}</span></div>
      <div class="title">${s.name||'Shop'}</div>
      <div class="meta">📍 ${s.area||''} ${s.city||''} · 📱 ${s.phone||''} ${s.ownerEmail? '· ✉️ '+s.ownerEmail.slice(0,3)+'***' : ''}</div>
      <div class="actions">
        <a class="act act-primary" href="tel:${s.phone}" onclick="track('${s.id}','callClicks')">📞 Call</a>
        <a class="act" href="https://wa.me/91${s.phone}" target="_blank" onclick="track('${s.id}','bookClicks')">💬 WhatsApp</a>
        <a class="act" href="${s.map||'#'}" target="_blank" onclick="track('${s.id}','mapClicks')">📍 Map</a>
      </div>
    </div>
  `).join('');
}
window.track=async(id,field)=>{
  try{ await updateDoc(doc(db,'shops',id),{[field]:increment(1),views:increment(1)}); log(`Tracked ${field} for ${id}`); }catch(e){ log('Track failed: '+e.code); }
}
function filter(){
  const term=(document.getElementById('searchBox').value||'').toLowerCase();
  const town=document.getElementById('townFilter').value;
  const cat=document.getElementById('catFilter').value;
  let f=allShops.filter(s=>{
    const search=!term||(s.name+s.area+s.city+s.category).toLowerCase().includes(term);
    const t=!town||s.city===town;
    const c=!cat||s.category===cat;
    return search&&t&&c;
  });
  render(f);
}
document.getElementById('searchBox').addEventListener('input',filter);
document.getElementById('townFilter').addEventListener('change',filter);
document.getElementById('catFilter').addEventListener('change',filter);
load();
</script>
</body>
</html>
