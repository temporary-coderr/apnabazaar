<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lokmart - Apna Local Bazaar | Jaora, Raghogarh, Rajgarh</title>
<meta name="description" content="Jaora, Raghogarh, Rajgarh ka apna local bazaar - discover local shops, banners and products with Lokmart.">
<meta name="keywords" content="Jaora bazaar, Raghogarh shops, Rajgarh local market, Lokmart, Desi Bazaar, Apna Bazaar">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://lokmart.in/">
<meta property="og:title" content="Lokmart - Apna Local Bazaar">
<meta property="og:description" content="Jaora, Raghogarh, Rajgarh ka apna local bazaar.">
<meta property="og:url" content="https://lokmart.in/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FF6B2C">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"Lokmart","url":"https://lokmart.in/","description":"Jaora, Raghogarh and Rajgarh local bazaar"}
</script>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF6B2C;--bg:#FFFBF5;--border:#F3E8D3;--ink:#1A1A1A;--muted:#6B7280;--cream:#FFF0E6}
*{box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);margin:0;color:var(--ink)}
h1{font-family:'Fraunces',serif}
.header{background:white;border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px}.brand img{width:36px;height:36px}
.hero{background:linear-gradient(135deg,#FF6B2C,#FF8A50);color:white;padding:20px 16px;text-align:center}
.filters{background:white;padding:10px 16px;border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:40;display:flex;gap:8px;overflow-x:auto}
.filter-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:white;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.filter-btn.active{background:var(--ink);color:white}
.container{max-width:1100px;margin:0 auto;padding:12px 16px}
.shops-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.shops-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.shops-grid{grid-template-columns:repeat(4,1fr)}}
.shop-card{background:white;border-radius:16px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:.2s;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.shop-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.shop-banner{width:100%;height:140px;object-fit:cover;background:var(--cream);display:block}
.shop-banner-placeholder{height:140px;background:linear-gradient(135deg,#FFF0E6,#F3E8D3);display:flex;align-items:center;justify-content:center;font-size:36px}
.shop-body{padding:10px}
.shop-name{font-weight:800;font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-meta{font-size:11px;color:var(--muted);margin-top:3px}
.badge{padding:3px 7px;border-radius:10px;font-size:9px;font-weight:800;display:inline-block;margin-top:4px}
.badge-premium{background:#FFF0E6;color:#FF6B2C;border:1px solid #FF6B2C}.badge-popular{background:#1A1A1A;color:#FFD700}
.search{width:100%;max-width:500px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none}
.search-controls{display:flex;justify-content:center;gap:8px;align-items:center}
.search-controls .search{flex:1}
.voice-btn,.share-btn{border:0;border-radius:12px;padding:12px;background:#1A1A1A;color:#fff;font-weight:700;cursor:pointer}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtcdBS75tgYJ5W1wilHT9y4rNI1LzUAHI",
  authDomain: "website-1cb04.firebaseapp.com",
  projectId: "website-1cb04",
  storageBucket: "website-1cb04.firebasestorage.app",
  messagingSenderId: "392147898697",
  appId: "1:392147898697:web:faa25a34b938ccd739ca98"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allShops=[];
let activeCat='All';
let deferredInstallPrompt=null;

async function loadShops(){
  document.getElementById('status').textContent='Loading banners...';
  try{
    const q = query(collection(db,"shops"), where("approved","==",true));
    const snap = await getDocs(q);
    allShops = snap.docs.map(d=>({id:d.id,...d.data()}));
    allShops.sort((a,b)=>{
      const scoreA=(a.isBannerAd?1000:0)+(a.isPopular?500:0)+(a.isPremium?200:0);
      const scoreB=(b.isBannerAd?1000:0)+(b.isPopular?500:0)+(b.isPremium?200:0);
      return scoreB-scoreA;
    });
    document.getElementById('status').textContent=`${allShops.length} shops • Click banner to view products`;
    render();
  }catch(error){
    document.getElementById('status').textContent='Unable to load shops. Please try again later.';
    console.error('Shop list load failed:',error);
  }
}

function render(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  const grid=document.getElementById('shopsGrid');
  const filtered=allShops.filter(s=>{
    const mSearch=!search||(s.name||'').toLowerCase().includes(search)||(s.category||'').toLowerCase().includes(search)||(s.area||'').toLowerCase().includes(search);
    const mCat=activeCat==='All'||(s.category||'General')===activeCat;
    return mSearch&&mCat;
  });
  grid.innerHTML='';
  if(filtered.length===0){ const empty=document.createElement('p'); empty.style.gridColumn='1/-1'; empty.style.textAlign='center'; empty.style.color='#6B7280'; empty.textContent='No shops found'; grid.appendChild(empty); return; }
  filtered.forEach(shop=>{
    const hasBanner=typeof shop.bannerImage==='string' && shop.bannerImage.startsWith('https://res.cloudinary.com/');
    const el=document.createElement('a');
    el.className='shop-card';
    el.href=`./store/?id=${encodeURIComponent(shop.id)}`;
    el.style.textDecoration='none';
    el.style.color='inherit';
    const placeholder=document.createElement('div');
    placeholder.className='shop-banner-placeholder';
    placeholder.textContent='🏪';
    if(hasBanner){
      const img=document.createElement('img');
      img.className='shop-banner';
      img.src=shop.bannerImage;
      img.alt=`${shop.name||'Shop'} banner`;
      img.loading='lazy';
      img.onerror=()=>img.replaceWith(placeholder);
      el.appendChild(img);
    }else el.appendChild(placeholder);
    const body=document.createElement('div');
    body.className='shop-body';
    const name=document.createElement('div');
    name.className='shop-name';
    name.textContent=shop.name||'Shop';
    const meta=document.createElement('div');
    meta.className='shop-meta';
    meta.textContent=`📍 ${shop.area||'Jaora'} • ${shop.category||'General'}`;
    body.append(name,meta);
    if(shop.isPremium){const badge=document.createElement('span');badge.className='badge badge-premium';badge.textContent='Premium';body.appendChild(badge);}
    if(shop.isPopular){const badge=document.createElement('span');badge.className='badge badge-popular';badge.textContent='Popular';body.appendChild(badge);}
    el.appendChild(body);
    grid.appendChild(el);
  });
}

window.filterCat=(cat,btn)=>{
  activeCat=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
window.searchShops=()=>render();
window.shareBazaar=async()=>{
  const shareData={title:'Lokmart - Apna Local Bazaar',url:location.href};
  if(navigator.share) await navigator.share(shareData);
  else if(navigator.clipboard) await navigator.clipboard.writeText(location.href);
};
window.startVoiceSearch=()=>{
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const status=document.getElementById('status');
  if(!Recognition){status.textContent='Hindi voice search is not supported in this browser.';return;}
  const recognition=new Recognition();
  recognition.lang='hi-IN';
  recognition.interimResults=false;
  status.textContent='🎤 सुन रहा हूँ...';
  recognition.onresult=event=>{
    const transcript=event.results[0][0].transcript;
    document.getElementById('searchInput').value=transcript;
    status.textContent=`✅ आपने बोला: "${transcript}"`;
    render();
  };
  recognition.onerror=()=>{status.textContent='Voice search failed. Please try again.';};
  recognition.onend=()=>{if(status.textContent==='🎤 सुन रहा हूँ...')status.textContent='';};
  recognition.start();
};
window.installLokmart=async()=>{
  if(!deferredInstallPrompt)return;
  await deferredInstallPrompt.prompt();
  deferredInstallPrompt=null;
  document.getElementById('installBanner').hidden=true;
};
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  document.getElementById('installBanner').hidden=false;
});

loadShops();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(error=>console.error('Service worker registration failed:',error));
</script>
</head>
<body>
<div class="header"><div class="brand"><img src="./favicon.svg" alt=""><div style="font-weight:800;font-family:Fraunces;">लोकमार्ट - Jaora</div></div><div style="font-size:11px;color:#6B7280;">Apna Local Bazaar</div></div>
<div class="hero">
  <h1 style="margin:0;">Jaora Bazaar 🛍️</h1>
  <p style="margin:6px 0 12px 0;opacity:.9;font-size:13px;">Shop banners - Click to view products under shop</p>
  <div class="search-controls"><input id="searchInput" class="search" placeholder="Search shop, area..." oninput="searchShops()"/><button class="voice-btn" onclick="startVoiceSearch()" aria-label="Hindi voice search">🎤 हिंदी</button></div>
  <button class="share-btn" style="margin-top:8px;" onclick="shareBazaar()">Share Bazaar</button>
  <p id="status" style="font-size:11px;opacity:.8;margin-top:8px;">Loading...</p>
</div>
<div class="filters">
  <button class="filter-btn active" onclick="filterCat('All',this)">All</button>
  <button class="filter-btn" onclick="filterCat('Clothing',this)">Clothing</button>
  <button class="filter-btn" onclick="filterCat('Electronics',this)">Electronics</button>
  <button class="filter-btn" onclick="filterCat('Decor',this)">Decor</button>
  <button class="filter-btn" onclick="filterCat('Grocery',this)">Grocery</button>
  <button class="filter-btn" onclick="filterCat('General',this)">General</button>
</div>
<div id="installBanner" class="container" hidden><button class="share-btn" onclick="installLokmart()">Install Lokmart app</button></div>
<div class="container"><div id="shopsGrid" class="shops-grid"></div></div>
</body></html>
